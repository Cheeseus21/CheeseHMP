l_korean:
 # NOTE: English placeholder text. Awaiting Korean translation.

 ############################################################################
 ### SOUTH AFRICA - THE FUSION CABINET
 ############################################################################

 ### MINISTERS ##############################################################

 SAF_nicolaas_havenga:0 "재무부 장관"
 SAF_sir_patrick_duncan:0 "광공업부 장관"

 ### THE CRISIS #############################################################

 SAF_the_abyssinian_crisis:0 "아비시니아 위기"
 SAF_the_abyssinian_crisis_desc:0 "이탈리아는 아디스아바바에 입성했고, 국제연맹은 아무것도 하지 않았습니다. 총리는 이 문제를 덮으려 하고, 부총리는 집단 안보의 약속이 지켜지기를 바랍니다. 어느 쪽도 상대 없이는 국정을 이끌 수 없고, 어느 쪽도 물러설 생각이 없습니다.\n\n이제는 내각이 곧 전장입니다."

 ### CABINET GATES ##########################################################

 SAF_minister_havenga_seated_tt:0 "§YN.C. 하빙아§!가 정치 고문으로서 내각에 앉아 있습니다."
 SAF_minister_pirow_seated_tt:0 "§Y오스발트 피로우§!가 정치 고문으로서 내각에 앉아 있습니다."
 SAF_minister_hofmeyr_seated_tt:0 "§Y얀 헨드리크 호프메이어§!가 정치 고문으로서 내각에 앉아 있습니다."

 SAF_cabinet_favours_hertzog_tt:0 "§Y비동맹주의§! 지지율이 §Y민주주의§!를 앞서고 있습니다."
 SAF_cabinet_favours_smuts_tt:0 "§Y민주주의§! 지지율이 §Y비동맹주의§!를 앞서고 있습니다."

 SAF_flip_to_smuts_tt:0 "§R안정도§!가 흡수한 지지율을 새 합계로 나눈 값만큼 하락합니다."
 SAF_flip_to_hertzog_tt:0 "§R전쟁 지지도§!가 흡수한 지지율을 새 합계로 나눈 값만큼 하락합니다."


 SAF_hertzog_man_havenga:0 "헤르초흐의 사람"
 SAF_hertzog_man_pirow:0 "헤르초흐의 사람"
 SAF_smuts_man_hofmeyr:0 "스뮈츠의 사람"
 SAF_smuts_man_duncan:0 "스뮈츠의 사람"
 SAF_smuts_man_stuttaford:0 "스뮈츠의 사람"

 SAF_free_cabinet_seat_tt:0 "§Y내각 탁자에 빈자리§!가 있습니다."

 ### THE CABINET DECISIONS ##################################################

 SAF_cabinet_decisions:0 "융합 내각"

 SAF_cabinet_reshuffle:0 "내각 개편"
 SAF_cabinet_reshuffle_desc:0 "공개적으로 사임하는 사람 없이도 내각을 재배치할 수 있습니다. 단번에 해치우고 집안 정리라고 부르기만 하면 됩니다. 개편이 진행되는 동안에는 모든 장관직이 열려 있고, 누구의 해임도 뉴스거리가 되지 않습니다."
 SAF_reshuffle_once_a_year_tt:0 "올해는 아직 내각이 개편되지 §Y않았습니다§!."
 SAF_reshuffle_open_tt:0 "§Y내각이 28일 동안 열려 있습니다.§! 임명과 해임에 비용이 §G들지 않습니다§!."
 SAF_reshuffle_closed_tt:0 "§R개편이 끝났습니다.§! 해임에 다시 정치력과 지지율이 소모됩니다."
 SAF_reshuffle_not_active_tt:0 "§Y내각 개편§!이 진행 중이 아닙니다."
 SAF_cabinet_walk_out:0 "연정 탈퇴가 임박하다"
 SAF_cabinet_walk_out_desc:0 "한쪽 진영이 내각을 지배하게 되었습니다. 60일 안에 균형을 되돌리지 않으면, 다른 쪽이 연정에서 탈퇴합니다."

 SAF_dismiss_havenga:0 "N.C. 하빙아 해임"
 SAF_dismiss_havenga_desc:0 "재무부 장관에게 더 이상 그의 봉직이 필요치 않다고 통보해야 합니다. 그는 이 내각이 세워질 때부터 자리를 지켜 왔고, 조용히 물러나지 않을 것입니다."
 SAF_dismiss_pirow:0 "오스발트 피로우 해임"
 SAF_dismiss_pirow_desc:0 "국방부 장관을 내보내야 합니다. 그는 재무장 계획의 지지자들을 데리고 나가면서, 나가는 길에 하고 싶은 말을 전부 쏟아낼 것입니다."
 SAF_dismiss_hofmeyr:0 "얀 헨드리크 호프메이어 해임"
 SAF_dismiss_hofmeyr_desc:0 "내무부 장관을 내보내야 합니다. 그는 전에도 신념을 이유로 사임한 적이 있고, 이번 일도 똑같은 일처럼 보이게 만들 것입니다."
 SAF_dismiss_duncan:0 "패트릭 던컨 경 해임"
 SAF_dismiss_duncan_desc:0 "광공업부 장관을 내보내야 합니다. 그는 내각에서 가장 존경받는 인물이며, 의회의 모두가 그 사실을 알고 있습니다."
 SAF_dismiss_stuttaford:0 "리처드 스터터포드 해임"
 SAF_dismiss_stuttaford_desc:0 "광공업부 장관을 내보내야 합니다. 그는 부탁을 받아 그 자리를 맡았으니, 돌려주는 데 잠을 설치지는 않을 것입니다."



 SAF_smuts_soldier_statesman:0 "군인이자 정치가"
 SAF_smuts_soldier_statesman_2:0 "군인이자 정치가"

 SAF_smuts_deputy_prime_minister:0 "내각의 스뮈츠"

 ### HAVENGA - FINANCE ######################################################

 SAF_the_havenga_pillar:0 "하빙아의 재무부"
 SAF_the_havenga_pillar_desc:0 "클라시 하빙아는 1932년 우리를 금본위제에서 벗어나게 했고, 그 뒤로 모든 예산의 균형을 맞춰 왔습니다. 그는 헤르초흐의 가장 오랜 동지이자, 돈 문제에 관한 한 내각에서 가장 논쟁하기 어려운 인물입니다."
 SAF_insolvency_act:0 "파산법"
 SAF_insolvency_act_desc:0 "대공황은 10년치 부실 채권을 남겼습니다. 법원에서 그것들을 정리해야 신용이 다시 돌기 시작할 것입니다."
 SAF_farmers_assistance_act:0 "농민 지원법"
 SAF_farmers_assistance_act_desc:0 "국민당의 표밭인 플라텔란트를 위한 구제책입니다. 이를 받는 사람들은 수표에 서명한 이가 누구인지 기억할 것입니다."
 SAF_workmen_compensation_act:0 "노동자 보상법"
 SAF_workmen_compensation_act_desc:0 "광산과 공장에서 입은 부상에 대한 보상을, 산업계가 감당할 수 있는 수준으로 정합니다."
 SAF_pensions_act:0 "연금법"
 SAF_pensions_act_desc:0 "금 수입으로 재원을 마련한, 가난한 백인을 위한 연금입니다. 재무부가 해낸 일 중 가장 인기 있는 일입니다."

 ### PIROW - DEFENCE ########################################################

 SAF_the_pirow_program:0 "피로우 계획"
 SAF_the_pirow_program_desc:0 "오스발트 피로우의 5개년 국방 계획입니다. 도로, 강철, 특수임무부대, 그리고 공군. 그는 또한 내각에서 가장 공공연한 친독파이며, 그 사실을 굳이 숨기려 하지도 않습니다."
 SAF_national_roads_act:0 "국가 도로법"
 SAF_national_roads_act_desc:0 "자체 기금을 가진 국가 도로 위원회입니다. 피로우는 이것이 국방 조치라고 주장합니다. 아주 틀린 말은 아닙니다."
 SAF_iron_and_steel_industry_act:0 "철강 산업법"
 SAF_iron_and_steel_industry_act_desc:0 "프리토리아의 아이스코를 확장합니다. 강판조차 스스로 압연하지 못하는 나라는 스스로 무장할 수도 없습니다."
 SAF_defence_amendment_act:0 "국방 수정법"
 SAF_defence_amendment_act_desc:0 "해안 수비대, 확대된 현역 시민군, 그리고 그들을 소집할 법적 장치입니다."
 SAF_appropriation_act:0 "세출법"
 SAF_appropriation_act_desc:0 "마침내 통과된 국방 예산입니다. 피로우는 해마다 더 많은 것을 요구했고 더 적게 받아 왔습니다. 이번에는 대부분을 손에 넣습니다."

 ### HERTZOG - PRIME MINISTER AND EXTERNAL AFFAIRS ##########################

 SAF_the_hertzog_bills:0 "헤르초흐 법안"
 SAF_the_hertzog_bills_desc:0 "총리는 외무를 직접 맡고 있습니다. 그가 이 의회에서 원하는 것은 확정된 원주민 정책과 런던의 손이 닿지 않는 주권입니다."
 SAF_native_trust_and_land_act:0 "원주민 신탁 및 토지법"
 SAF_native_trust_and_land_act_desc:0 "짝을 이루는 법안입니다. 토지 문제를 정부의 조건대로 매듭짓고, 헤르초흐가 15년 동안 바라 온 3분의 2 다수를 사 줍니다."
 SAF_coronation_oath_act:0 "대관 선서법"
 SAF_coronation_oath_act_desc:0 "국왕은 연방을 위한 별도의 선서를 하게 됩니다. 작은 일이지만, 논쟁 전체의 축소판입니다. 우리는 식민지가 아니며, 우리의 다툼은 우리의 것입니다."
 SAF_south_africa_amendment_act:0 "남아프리카법 수정안"
 SAF_south_africa_amendment_act_desc:0 "헤르초흐가 지금껏 밀어붙인 것 중 가장 멀리 나간 법입니다. 연방의 주권은 절대적이며, 여기에는 영국의 전쟁에서 비켜설 권리도 포함됩니다."

 ### SMUTS - JUSTICE ########################################################

 SAF_the_smuts_statutes:0 "스뮈츠 법령"
 SAF_the_smuts_statutes_desc:0 "부총리는 법무를 맡고 있습니다. 그는 해임될 수 없고, 사임하지 않을 것이며, 헤르초흐 다음에 누가 오든 연방을 통치할 수 있는 상태로 남겨 둘 작정입니다."
 SAF_general_law_act:0 "일반법 수정법"
 SAF_general_law_act_desc:0 "정리 차원의 법안이자, 아직 선포하지 않은 비상사태에서 국가가 할 수 있는 일을 조용히 넓혀 두는 법안입니다."
 SAF_public_service_act:0 "공무원법"
 SAF_public_service_act_desc:0 "정당이 아니라 능력에 따라 임용되는 직업 공무원제입니다. 헤르초흐의 사람들은 이것이 무엇을 위한 것인지 정확히 알고 있습니다."
 SAF_industrial_conciliation_act:0 "산업 조정법"
 SAF_industrial_conciliation_act_desc:0 "란트의 분쟁이 광산을 멈추기 전에 해결하는 장치입니다. 산업 평화는 하원의 그 어떤 표결보다 값진 것입니다."
 SAF_senate_act:0 "상원법"
 SAF_senate_act_desc:0 "다음 전쟁을 치러야 할 정부의 발목을 잡지 않도록 조정된 상원의 구성입니다."

 ### HOFMEYR - THE INTERIOR #################################################

 SAF_the_hofmeyr_interventions:0 "호프메이어의 개입"
 SAF_the_hofmeyr_interventions_desc:0 "얀 호프메이어는 열다섯에 학위를, 서른다섯에 각료직을 받았고, 스스로 믿지 않는 안건에 표를 던진 적이 단 한 번도 없습니다. 그는 스뮈츠의 사람이자 정부의 양심입니다."
 SAF_broadcasting_act:0 "방송법"
 SAF_broadcasting_act_desc:0 "두 언어로 방송하며 의회에 책임을 지는 남아프리카 방송공사입니다. 이것을 쥐는 자의 목소리는 연방의 모든 부엌에 닿을 것입니다."
 SAF_unemployment_benefits_act:0 "실업 급여법"
 SAF_unemployment_benefits_act_desc:0 "실직에 대비한 기여형 보험입니다. 소박하지만, 이제껏 누가 내놓은 것보다 많은 것입니다."
 SAF_childrens_act:0 "아동법"
 SAF_childrens_act_desc:0 "학교, 그리고 아이들을 학교에 머물게 할 국가의 의무입니다. 가난한 백인 문제에 대한 호프메이어 나름의 답이며, 재무부의 답보다 더 긴 호흡의 답입니다."
 SAF_public_health_act:0 "공중 보건법"
 SAF_public_health_act_desc:0 "호프메이어는 인종 장벽 앞에서 멈추는 보건 제도를 운영하지 않을 것이며, 그렇게 말할 표도 가지고 있습니다. 의사들보다 모병관들이 먼저 그 차이를 실감할 것입니다."

 ### DUNCAN - MINES AND INDUSTRIES ##########################################

 SAF_the_duncan_boom:0 "[GetSAFMinesMinistryName]"
 SAF_the_duncan_boom_desc:0 "[GetSAFMinesMinistryDesc]"
 SAF_the_duncan_boom_duncan:0 "던컨 호황"
 SAF_the_duncan_boom_duncan_desc:0 "금값은 140실링이고, 그것으로 무엇을 해야 하는지 아는 광산 장관이 있습니다. 패트릭 던컨은 스뮈츠의 사람이며, 잉글랜드 태생이고, 내각에서 가장 조용히 유능한 행정가입니다."
 SAF_the_duncan_boom_stuttaford:0 "스터타포드의 수습기"
 SAF_the_duncan_boom_stuttaford_desc:0 "던컨은 총독 관저에 있고, 광산은 포목상에게 넘어갔습니다. 리처드 스터타포드는 케이프타운의 절반에 가구를 팔아 봤지만, 갱도의 비용을 계산해 본 적은 평생 한 번도 없습니다.\n\n그는 이 부처를 배울 것입니다. 천천히 배울 것이고, 그 수업료는 업계가 치를 것입니다."
 SAF_gold_tax_act:0 "금 조세법"
 SAF_gold_tax_act_desc:0 "광산에 대한 초과 이윤세입니다. 광업회의소는 불평하겠지만, 재무부는 그러지 않을 것입니다."
 SAF_sugar_act:0 "설탕법"
 SAF_sugar_act_desc:0 "조직되고 보호받는 나탈의 설탕 산업입니다. 해안 지방이 20년 동안 요구해 온 일입니다."
 SAF_mining_registration_act:0 "광업 등록법"
 SAF_mining_registration_act_desc:0 "채굴권, 소유권, 노동력을 하나의 대장에 올립니다. 따분하지만, 나머지 전부를 합친 것보다 값진 일입니다."
 SAF_land_bank_act:0 "토지 은행법"
 SAF_land_bank_act_desc:0 "국가가 토지를 담보로 빌려주는 저리 신용입니다. 호황의 마지막 조각이자, 호황보다 오래 남을 조각입니다."

 ### RESOLVING THE COALITION ################################################

 SAF_continue_the_course:0 "가던 길을 계속 가다"
 SAF_continue_the_course_desc:0 "융합은 8년을 버텼고 이보다 나쁜 일도 넘겨 왔습니다. 내각을 지금 이대로 두고, 그 문제가 정말로 닥쳤을 때 하원이 결정하게 하십시오."

 SAF_hertzog_government:0 "헤르초흐 정부"
 SAF_hertzog_government_desc:0 "연방은 총리와 그의 신념을 지켰습니다. 이제 무엇이 오든 그의 조건대로 옵니다."
 SAF_smuts_government:0 "스뮈츠 정부"
 SAF_smuts_government_desc:0 "이제 정부는 장군의 것이고, 벌써 북쪽을 바라보고 있습니다."

 SAF_force_the_issue:0 "결판을 내다"
 SAF_force_the_issue_desc:0 "지금 이 문제를 내각에, 회의장 바닥에 올려 끝장을 보십시오. 오늘 정부를 장악한 자가 내일도 정부를 장악할 것입니다."
 SAF_the_walk_out:0 "연정 탈퇴"
 SAF_the_walk_out_desc:0 "자기 정부 안에서 밀려난 열세 진영이 항의의 표시로 연정을 떠납니다."
 SAF_force_the_issue_tt:0 "§Y지금의 균형대로, 즉시 연정을 매듭짓습니다§!. §R아직 열려 있는 모든 장관 계열이 닫힙니다.§!"
 SAF_coalition_open_tt:0 "§Y융합 내각§!이 아직 열려 있습니다"
 SAF_hertzog_wing_alone_tt:0 "연정 탈퇴 이후 §Y헤르초흐의 진영§!이 홀로 통치하고 있습니다"
