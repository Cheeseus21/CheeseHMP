 SAF_african_crisis_decisions:0 "아프리카 위기"
 SAF_african_crisis_decisions_desc:0 "추축국에 아프리카의 주를 잃을 때마다 해당 주의 기본 안정도 비용이 위기에 더해지며, 월간 상실 속도에 따라 배율이 적용됩니다. 비용은 전선이 안정된 후에도 지속되며, 탈환한 지역은 기본 비용만 환급됩니다. 요충지(지도에 별 표시)는 추축국이 점령 중인 동안 각각 §R3%§!의 안정도가 추가로 소모됩니다. 중동은 전체를 상실했을 때 1회에 한해 §R5%§!가 부과되며, 탈환해도 환급되지 않습니다. 리비아는 상실 비용이 없으며, 정복 시 주당 §Y0.5%§!를 회복하고 그 점령지를 잃으면 다시 소모됩니다."
