 SAF_hac_show_tt:0 "마우스를 올리는 동안 해당 주를 지도에 강조 표시합니다. 이 결단을 실행해도 아무 효과가 없습니다."
 SAF_hac_map_tt:0 "상실한 주 하나당 기본 안정도 비용이며, 월간 상실 속도에 따라 배율이 적용됩니다:\n초록색: 리비아, 상실 비용 없음; 정복 시 주당 §Y0.5%§! 회복\n연두색: §Y0.5%§! (이집트)\n노란색: §Y1%§! (남부 이집트)\n호박색: §Y1.25%§! (수단)\n주황색: §Y1.5%§! (소말릴란드, 이탈리아령 동아프리카)\n진주황색: §Y2%§! (동아프리카, 프랑스령 아프리카)\n주홍색: §Y2.5%§! (콩고)\n빨간색: §Y3%§! (남부 아프리카)\n진홍색: §Y5%§! (로디지아)\n청록색: 중동, 전체 상실 시 1회 §R5%§! 블록, 환급 없음\n별: 요충지, 추축국 점령 중 각각 안정도 §R3%§!\n검은 빗금: 현재 추축국 통제 중"
