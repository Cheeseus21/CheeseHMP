 SAF.40.d:0 "융합 내각은 J.B.M. 헤르초흐의 비동맹 진영과 얀 스뮈츠의 민주주의 진영 사이의 균형이며, 전적으로 정당 지지율로 결정됩니다.\n\n§R어디서 확인하는가§!\n§R융합 내각§! 모디파이어 툴팁은 각 진영에 앉은 장관들이 매주 자기 정당 지지율에 더하는 값과 순증감 방향을 보여주며, 모디파이어 자체의 항목이 지금 지불하고 있는 대가입니다. 격차는 §R비동맹 지지율에서 민주주의 지지율을 뺀 값§!입니다. 양수면 헤르초흐, 음수면 스뮈츠에게 유리합니다.\n\n§R다섯 단계§!\n격차는 매주 확인되어 다섯 단계 중 하나를 결정합니다:\n§R헤르초흐 압도§! (20 초과): 안정도 +10%, 전쟁 지지도 -10%, 징집 가능 인구 -10%\n§R헤르초흐 우세§! (10 초과): 안정도 +5%, 정치력 -10%, 전쟁 지지도 -5%\n§R교착§! (양쪽 10 이내): 정치력 -15%\n§R스뮈츠 우세§! (-10 미만): 전쟁 지지도 +5%, 정치력 -10%, 안정도 -5%\n§R스뮈츠 압도§! (-20 미만): 전쟁 지지도 +10%, 안정도 -10%, 일일 파시즘 지지 +0.01\n\n§R장관과 급진파§!\n재임 중인 장관은 매주 자기 정당의 지지율을 움직이며, 그가 통과시킨 법안마다 그 속도가 빨라집니다. 보좌관이 통과시킨 법안은 그 진영의 §R급진화된 내각§! 단계를 하나씩 올리고, 진영 지도자가 직접 통과시킨 법안은 둘씩 내립니다. 헤르초흐 쪽 단계는 단계당 안정도, 전쟁 지지도, 정치력, 공장 생산량을 2.5%씩 깎고, 스뮈츠 쪽은 소비재와 동원 속도를 대가로 합니다. §R급진파 제어§!는 정치력 100으로 한 단계를 되사옵니다.\n\n§R내각 이탈§!\n어느 한쪽이 압도 상태인 동안 균형은 매일 추적됩니다. 어느 쪽으로든 30을 넘으면 열세 진영이 60일 카운트다운을 시작하며, 그동안 연방은 §R내각 이탈 위기§!를 안습니다: 정치력 -25%, 안정도 -25%. 격차를 다시 30 이내로 되돌리면 취소됩니다.\n\n§R결말§!\n세 가지 결과가 있으며 서로 배타적입니다.\n§R쟁점화§!만 직접 선택할 수 있고, 안슐루스 이후에만 가능합니다. 어느 진영이 정권을 잡을지 직접 고릅니다.\n§R현상 유지§!는 독일이 연합국에 선전포고할 때 저절로 완료됩니다. 스뮈츠가 정권을 잡고 헤르초흐는 야당으로 물러나거나 완전히 은퇴합니다.\n§R내각 이탈§!은 카운트다운이 끝나면 완료됩니다. 우세 진영이 상대를 몰아내고 홀로 통치하며, 자기 진영의 급진파는 최고 단계에 고정됩니다.\n\n무엇이 발동하든 내각은 닫히고 균형 모디파이어는 제거됩니다. 재임 중이던 장관들의 정책은 영구 국가 정신으로 보존되지만, 내각 이탈의 경우 패배한 진영의 성과는 함께 사라집니다."
