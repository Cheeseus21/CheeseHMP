 ### EVENTS
 ############################################################################

 SAF.1.t:0 "총독 관저"
 SAF.1.d:0 "클래런던 경의 임기가 끝났고, 연방은 처음으로 런던이 보낸 총독을 받아들이는 대신 스스로 총독을 지명합니다. 그는 일주일 뒤 취임합니다.\n\n의례적인 임명처럼 보이지만, 그렇지 않습니다. 언젠가 이 의회가 전쟁을 두고 갈라진다면, 총독 관저의 그 사람이 총리가 의회 해산을 얻을 수 있을지를 — 곧 총리가 살아남을지를 — 결정하게 됩니다.\n\n§R니콜라스 야코부스 데 웨트§!는 총리와 같은 성향의 법률가로, 왕권이 내각의 일에 끼어들지 않게 할 사람입니다. §R패트릭 던컨 경§!은 그러지 않을 사람입니다. 하지만 그는 광공업부를 맡고 있고, 총독 관저는 현직 장관이 갈 자리가 아닙니다."
 SAF.1.a:0 "니콜라스 야코부스 데 웨트가 우리를 대표한다."
 SAF.1.b:0 "패트릭 던컨 경으로 한다. 광산 장관은 다른 사람을 찾겠다."

 SAF.10.t:0 "연정의 결말"
 SAF.10.d:0 "융합은 더 갈 곳이 없습니다."
 SAF.10.a:0 "그리 하도록."

 SAF.22.t:0 "중립 표결"
 SAF.22.d_resignation:0 "중립 동의안이 하원에 상정되고, 하원은 그것을 짓밟습니다. 표차는 항소할 여지가 없는 수준이고, 패트릭 던컨 경이 총독 관저에 있는 한 요청할 해산이란 없습니다. 양쪽 의석의 모든 의원이 그것을 알고 있습니다.\n\n헤르초흐는 요청하지 않습니다. 그날 오후로 총리직에서 물러나고, 의석도 함께 내려놓고, 말 한마디 없이 의사당을 떠납니다."
 SAF.22.d_refusal:0 "나라는 총리 편입니다. 하원은 몇 표 차이로 그렇지 않습니다. 중립 동의안은 모두가 — 누구보다 헤르초흐 자신이 — 놀란 가운데 부결됩니다.\n\n그는 자신을 틀림없이 다시 세워 줄 해산을 요청하러 총독 관저로 차를 몹니다. 패트릭 던컨 경은 거부합니다. 그를 그 자리에 앉힌 것은 총리이고, 총리는 이제 어떻게 해 볼 도리가 없습니다.\n\n스뮈츠는 나라가 그에게 준 적 없는 정부를 손에 넣습니다."
 SAF.22.a:0 "하원이 말했다."
 SAF.22.b:0 "의회는 건재하다."


 SAF.12.t:0 "총리의 승리"
 SAF.12.d:0 "하원이 표결에 들어가고, 이번에는 총리의 사람들이 준비되어 있습니다. 중립 동의안은 아슬아슬하게 부결되어 연방은 참전하게 되지만, 헤르초흐는 무너지지 않고, 물러나라는 요구도 받지 않습니다.\n\n그는 총리로 남습니다. 스뮈츠는 그 밑에 앉느니 정부를 떠났습니다.\n\n연방은 4년 동안 참전해서는 안 된다고 주장해 온 사람 아래에서 전쟁을 치릅니다. 북쪽에서 좋은 소식이 들려오는 동안은 버틸 수 있을 것입니다."
 SAF.12.a:0 "연방은 우리 조건으로 싸운다. 아니면 싸우지 않는다."

 SAF.13.t:0 "차지한 정부"
 SAF.13.d:0 "당 코커스는 머릿수를 확보했고, 그것을 쓰기 위해 전쟁을 기다릴 생각이 없습니다. 헤르초흐는 협의가 아니라 통보를 받습니다. 사임이 준비되고, 승계가 준비되고, 아침나절이면 모든 것이 끝나 있습니다.\n\n스뮈츠 장군이 총리입니다. 연방은 누구의 예상보다도 몇 달 앞서 본격적으로 무장하기 시작합니다.\n\n플라텔란트는 이 일이 어떻게 이루어졌는지 잊지 않을 것입니다."
 SAF.13.a:0 "나라가 나중에 고마워할 것이다."

 SAF.16.t:0 "결판을 내다"
 SAF.16.d:0 "유럽을 기다리는 대신 지금 이 문제를 내각에 부칩니다. 나라의 균형이 어떻든 어느 진영에든 정부를 맡길 수 있습니다. 다만 정부를 잡는 진영이 나라의 민심에서 멀수록, 나라를 돌려세우는 값은 비싸집니다."
 SAF.16.a:0 "§YJ.B.M. 헤르초흐§!가 정부를 이끈다."
 SAF.16.b:0 "§Y얀 스뮈츠§!가 정부를 잡는다."

 SAF.21.t:0 "연정 탈퇴 위협"
 SAF.21.d:0 "열세 진영은 상대의 지배 아래 앉아 있으려 하지 않습니다. 60일 안에 균형이 회복되지 않으면, 그 진영의 장관들이 연정에서 걸어 나갑니다."
 SAF.21.a:0 "60일이다."

 SAF.23.t:0 "연정 붕괴"
 SAF.23.d_hertzog:0 "개입파 장관들이 일제히 사표를 내고, 스뮈츠가 자기 사람들을 이끌고 정부를 떠납니다.\n\n헤르초흐는 홀로 통치합니다. 이제 그의 장관들에게 반박할 사람은 그 탁자에 남아 있지 않습니다."
 SAF.23.d_smuts:0 "국민당계 장관들은 깰 수 없는 지배 아래 앉아 있느니 내각을 걸어 나가고, 헤르초흐도 그들과 함께 아예 공직 생활에서 물러납니다.\n\n스뮈츠는 남은 것으로 정부를 꾸립니다. 이제 그의 장관들에게 반박할 사람은 그 탁자에 남아 있지 않습니다."
 SAF.23.a:0 "그럼, 홀로 간다."




