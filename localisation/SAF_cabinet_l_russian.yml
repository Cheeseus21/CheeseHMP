 SAF_gsa_pay_civs_4_tt:0 "§R4 гражданских завода§! уходят из Союза в закадровый актив Британии."
 SAF_gsa_pay_civs_6_tt:0 "§R6 гражданских завода§! уходят из Союза в закадровый актив Британии."
 SAF_gsa_pay_civs_8_tt:0 "§R8 гражданских завода§! уходят из Союза в закадровый актив Британии."
 SAF_gsa_development_dm:0 "Освоение новых территорий"
 SAF_gsa_window:0 "Window for a Greater South Africa"
 SAF_colonial_civil_service:0 "Colonial Civil Service"
 SAF_colonial_civil_service_desc:0 "A cadre of administrators for the new territories, trained in Pretoria and posted north. What took a season of improvisation becomes a month of routine."
 SAF_mandate_over_the_horn:0 "Mandate over the Horn"
 SAF_mandate_over_the_horn_desc:0 "The conquered Italian colonies were to be held in trust, not absorbed. London signs the trusteeship over, and the Union's writ runs to the Horn."
 SAF_development_corporations:0 "Development Corporations"
 SAF_development_corporations_desc:0 "State corporations on the IDC model, chartered for the new territories: power, works and industry where there was administration and little else."
 SAF_development_grants:0 "Development Grants"
 SAF_development_grants_desc:0 "Pretoria underwrites the building itself. A year of grants for every integrated territory, and cranes on every skyline that will take them."
 SAF_gsa_core_30_tt:0 "Integration now takes §Y30 days§! instead of 90"
 SAF_gsa_iea_corable_tt:0 "The §Yformer Italian East Africa§! can now be integrated"
 SAF_gsa_slots_up_tt:0 "Integration now grants §Y4 building slots§! instead of 2"
 SAF_gsa_grants_on_tt:0 "Integration now grants §Ya year of +100% construction speed§!"
 SAF_gsa_retro_tt:0 "Это будет применено §Yзадним числом§! ко всем областям, по которым это решение уже принималось."

 ### POST-CABINET POLITICS ##################################################

 SAF_war_not_of_our_choosing:0 "War Not of Our Choosing"
 SAF_war_not_of_our_choosing_desc:0 "The Prime Minister spent years keeping the Union out. The war has come anyway, and it will not wait for his convictions."
 SAF_hertzog_war_leader:0 "Reluctant War Leader"
 SAF_hertzog_promise_of_peace:0 "Promise of Peace"
 SAF_defence_resources_board_idea:0 "Defence Resources Board"
 SAF_defence_resources_board:0 "Defence Resources Board"
 SAF_defence_resources_board_desc:0 "One board to find out what the country can actually make, and to place the orders before the sea lanes close."
 SAF_munitions_from_the_mines:0 "Munitions from the Mines"
 SAF_munitions_from_the_mines_desc:0 "The Rand's workshops can turn shell casings as easily as drill parts. Every mine an arsenal."
 SAF_answers_for_the_benches:0 "Answers for the Benches"
 SAF_answers_for_the_benches_desc:0 "Every state lost up north is a question in the House. The government will need better answers than silence."
 SAF_news_from_the_north:0 "News from the North"
 SAF_news_from_the_north_desc:0 "The communiqués can be written more carefully than the battles are fought. What the platteland does not read cannot cost votes."
 SAF_congo_expedition:0 "Congo Expedition"
 SAF_congo_expedition_desc:0 "The brigades go north into the green dark of the Congo - not the war the platteland voted against, but a war all the same, and the Union is winning it."
 SAF_limpopo_line:0 "Limpopo Line"
 SAF_limpopo_line_desc:0 "Whatever happens to Africa, it stops at the river. The Union itself will be held - and be seen to be held."
