 ############################################################################
 ### SOUTH AFRICA - THE FUSION CABINET
 ############################################################################

 ### MINISTERS ##############################################################

 SAF_nicolaas_havenga: "Министр финансов"
 SAF_sir_patrick_duncan: "Министр шахт и промышленности"

 ### THE CRISIS #############################################################

 SAF_the_abyssinian_crisis: "Абиссинский кризис"
 SAF_the_abyssinian_crisis_desc: "Италия в Аддис-Абебе, а Лига не сделала ничего. Премьер-министр хочет закрыть вопрос; вице-премьер хочет, чтобы коллективная безопасность была соблюдена. Ни один из них не может править без другого, и ни один не намерен уступать.\n\nОтныне поле боя — кабинет."

 ### CABINET GATES ##########################################################

 SAF_minister_havenga_seated_tt: "§YН. К. Хавенга§! заседает в кабинете как политический советник."
 SAF_minister_pirow_seated_tt: "§YОсвальд Пироу§! заседает в кабинете как политический советник."
 SAF_minister_hofmeyr_seated_tt: "§YЯн Хендрик Хофмейр§! заседает в кабинете как политический советник."

 SAF_cabinet_favours_hertzog_tt: "Поддержка §YНейтралитета§! опережает §YДемократию§!."
 SAF_cabinet_favours_smuts_tt: "Поддержка §YДемократии§! опережает §YНейтралитет§!."

 SAF_flip_to_smuts_tt: "§RСтабильность§! падает на величину поглощённой поддержки, делённую на новый итог."
 SAF_flip_to_hertzog_tt: "§RПоддержка войны§! падает на величину поглощённой поддержки, делённую на новый итог."


 SAF_hertzog_man_havenga:0 "Человек Герцога"
 SAF_hertzog_man_pirow:0 "Человек Герцога"
 SAF_smuts_man_hofmeyr:0 "Человек Смутса"
 SAF_smuts_man_duncan:0 "Человек Смутса"
 SAF_smuts_man_stuttaford:0 "Человек Смутса"

 SAF_free_cabinet_seat_tt: "За столом кабинета есть §Yсвободное место§!."

 ### THE CABINET DECISIONS ##################################################

 SAF_cabinet_decisions: "Кабинет слияния"

 SAF_cabinet_reshuffle: "Перестановки в кабинете"
 SAF_cabinet_reshuffle_desc: "Министерство можно перетасовать так, что никто не уйдёт в отставку публично, — если сделать всё разом и назвать это наведением порядка. Пока это длится, портфели открыты, и ничьё увольнение не становится новостью."
 SAF_reshuffle_once_a_year_tt: "В этом году кабинет ещё §Yне§! перетасовывали."
 SAF_reshuffle_open_tt: "§YКабинет открыт 28 дней.§! Назначения и увольнения §Gничего не стоят§!."
 SAF_reshuffle_closed_tt: "§RПерестановки окончены.§! Увольнения снова стоят политической власти и поддержки."
 SAF_reshuffle_not_active_tt:0 "§YПерестановки в кабинете§! сейчас не идут."
 SAF_cabinet_walk_out:0 "Назревает уход из коалиции"
 SAF_cabinet_walk_out_desc:0 "Одно крыло стало господствовать в кабинете. Восстановите баланс за шестьдесят дней — иначе другое покинет коалицию."

 SAF_dismiss_havenga: "Уволить Н. К. Хавенгу"
 SAF_dismiss_havenga_desc: "Министру финансов предстоит услышать, что в его услугах больше не нуждаются. Он в этом кабинете с самого его основания и тихо не уйдёт."
 SAF_dismiss_pirow: "Уволить Освальда Пироу"
 SAF_dismiss_pirow_desc: "Министра обороны решено убрать. Он уведёт с собой сторонников программы перевооружения и по дороге выскажет всё, что думает."
 SAF_dismiss_hofmeyr: "Уволить Яна Хендрика Хофмейра"
 SAF_dismiss_hofmeyr_desc: "Министра внутренних дел решено убрать. Он уже уходил в отставку из принципа и сумеет представить это точно так же."
 SAF_dismiss_duncan: "Уволить сэра Патрика Дункана"
 SAF_dismiss_duncan_desc: "Министра шахт и промышленности решено убрать. Он самый уважаемый человек в правительстве, и весь парламент это знает."
 SAF_dismiss_stuttaford: "Уволить Ричарда Статтафорда"
 SAF_dismiss_stuttaford_desc: "Министра шахт и промышленности решено убрать. Он взял портфель в порядке одолжения и вернёт его без особых сожалений."



 SAF_smuts_soldier_statesman: "Солдат и государственный деятель"
 SAF_smuts_soldier_statesman_2: "Солдат и государственный деятель"

 SAF_smuts_deputy_prime_minister: "Смутс в кабинете"

 ### HAVENGA - FINANCE ######################################################

 SAF_the_havenga_pillar: "Казначейство Хавенги"
 SAF_the_havenga_pillar_desc: "Клази Хавенга снял нас с золотого стандарта в 1932 году и с тех пор сводил каждый бюджет без дефицита. Он старейший союзник Герцога и тот человек в кабинете, с которым труднее всего спорить о деньгах."
 SAF_insolvency_act: "Закон о несостоятельности"
 SAF_insolvency_act_desc: "Депрессия оставила за собой десятилетие безнадёжных бумаг. Очистите от них суды — и кредит снова придёт в движение."
 SAF_farmers_assistance_act: "Закон о помощи фермерам"
 SAF_farmers_assistance_act_desc: "Помощь платтеланду, где живёт электорат Национальной партии. Те, кто её примет, запомнят, кто подписал чек."
 SAF_workmen_compensation_act: "Закон о компенсациях рабочим"
 SAF_workmen_compensation_act_desc: "Компенсация за увечья на шахтах и заводах — по ставке, которую промышленность способна нести."
 SAF_pensions_act: "Закон о пенсиях"
 SAF_pensions_act_desc: "Пенсия для бедных белых, оплаченная золотыми доходами. Самое популярное, что когда-либо делало казначейство."

 ### PIROW - DEFENCE ########################################################

 SAF_the_pirow_program: "Программа Пироу"
 SAF_the_pirow_program_desc: "Пятилетний оборонный план Освальда Пироу: дороги, сталь, Батальон специального назначения и авиация. К тому же он самый открыто прогерманский человек в кабинете и не трудится это скрывать."
 SAF_national_roads_act: "Закон о национальных дорогах"
 SAF_national_roads_act_desc: "Национальный дорожный совет с собственным фондом. Пироу уверяет, что это оборонная мера. И он не так уж неправ."
 SAF_iron_and_steel_industry_act: "Закон о чёрной металлургии"
 SAF_iron_and_steel_industry_act_desc: "Iscor в Претории будет расширен. Страна, не способная прокатать собственный лист, не способна и вооружиться."
 SAF_defence_amendment_act: "Поправка к закону об обороне"
 SAF_defence_amendment_act_desc: "Береговые гарнизонные силы, расширенные Активные гражданские силы и правовой механизм для их созыва."
 SAF_appropriation_act: "Закон об ассигнованиях"
 SAF_appropriation_act_desc: "Оборонный бюджет наконец принят. Пироу каждый год просил больше и получал меньше; на этот раз ему дают почти всё."

 ### HERTZOG - PRIME MINISTER AND EXTERNAL AFFAIRS ##########################

 SAF_the_hertzog_bills: "Законопроекты Герцога"
 SAF_the_hertzog_bills_desc: "Премьер-министр сам держит внешние сношения. От этого парламента ему нужны решённый туземный вопрос и суверенитет, до которого не дотянется Лондон."
 SAF_native_trust_and_land_act: "Закон о туземном фонде и землях"
 SAF_native_trust_and_land_act_desc: "Парная мера. Она закрывает земельный вопрос на условиях правительства и покупает Герцогу большинство в две трети, которого он ждал пятнадцать лет."
 SAF_coronation_oath_act: "Закон о коронационной присяге"
 SAF_coronation_oath_act_desc: "Король принесёт отдельную присягу за Союз. Мелочь — и весь спор в миниатюре: мы не колония, и наши ссоры — наши собственные."
 SAF_south_africa_amendment_act: "Поправка к Акту о Южной Африке"
 SAF_south_africa_amendment_act_desc: "Дальше Герцог не заходил никогда. Суверенитет Союза абсолютен, и это включает право остаться в стороне от британской войны."

 ### SMUTS - JUSTICE ########################################################

 SAF_the_smuts_statutes: "Статуты Смутса"
 SAF_the_smuts_statutes_desc: "Вице-премьер держит юстицию. Его нельзя уволить, он не уйдёт сам и намерен оставить Союз управляемым для любого, кто придёт после Герцога."
 SAF_general_law_act: "Закон об общих поправках"
 SAF_general_law_act_desc: "Мера наведения порядка — и тихое расширение того, что позволено государству в чрезвычайном положении, которое оно ещё не объявило."
 SAF_public_service_act: "Закон о государственной службе"
 SAF_public_service_act_desc: "Профессиональная гражданская служба, назначаемая по заслугам, а не по партии. Люди Герцога прекрасно понимают, для чего это."
 SAF_industrial_conciliation_act: "Закон о трудовом примирении"
 SAF_industrial_conciliation_act_desc: "Механизм улаживать споры на Ранде прежде, чем они остановят шахты. Промышленный мир дороже любого голосования в Палате."
 SAF_senate_act: "Закон о Сенате"
 SAF_senate_act_desc: "Состав верхней палаты, устроенный так, чтобы она не мешала правительству, которому предстоит вести следующую войну."

 ### HOFMEYR - THE INTERIOR #################################################

 SAF_the_hofmeyr_interventions: "Вмешательства Хофмейра"
 SAF_the_hofmeyr_interventions_desc: "Ян Хофмейр получил диплом в пятнадцать и министерский пост в тридцать пять, и ни разу не голосовал за то, во что не верил. Он человек Смутса и совесть правительства."
 SAF_broadcasting_act: "Закон о радиовещании"
 SAF_broadcasting_act_desc: "Южноафриканская вещательная корпорация, на обоих языках, подотчётная парламенту. Того, кто ею владеет, услышат на каждой кухне Союза."
 SAF_unemployment_benefits_act: "Закон о пособиях по безработице"
 SAF_unemployment_benefits_act_desc: "Страхование на случай потери работы, на взносах. Скромно — и больше, чем кто-либо предлагал прежде."
 SAF_childrens_act: "Закон о детях"
 SAF_childrens_act_desc: "Школы — и обязанность государства удерживать в них детей. Собственный ответ Хофмейра на вопрос бедных белых, и рассчитанный на более долгий срок, чем ответ казначейства."
 SAF_public_health_act: "Закон о здравоохранении"
 SAF_public_health_act_desc: "Хофмейр не станет управлять здравоохранением, которое останавливается у цветного барьера, и у него хватит голосов, чтобы так заявить. Вербовщики почувствуют разницу раньше врачей."

 ### DUNCAN - MINES AND INDUSTRIES ##########################################

 SAF_the_duncan_boom: "[GetSAFMinesMinistryName]"
 SAF_the_duncan_boom_desc: "[GetSAFMinesMinistryDesc]"
 SAF_the_duncan_boom_duncan: "Бум Дункана"
 SAF_the_duncan_boom_duncan_desc: "Золото по 140 шиллингов — и министр шахт, который знает, что с этим делать. Патрик Дункан — человек Смутса, англичанин по рождению и самый незаметно-действенный администратор в кабинете."
 SAF_the_duncan_boom_stuttaford: "Ученичество Статтафорда"
 SAF_the_duncan_boom_stuttaford_desc: "Дункан в резиденции генерал-губернатора, а шахты отданы галантерейщику. Ричард Статтафорд продал мебель половине Кейптауна и ни разу в жизни не считал смету шахтного ствола.\n\nОн выучит портфель. Выучит медленно, и оплатит его обучение промышленность."
 SAF_gold_tax_act: "Закон о налоге на золото"
 SAF_gold_tax_act_desc: "Пошлина на сверхприбыли шахт. Горная палата будет жаловаться; казначейство — нет."
 SAF_sugar_act: "Закон о сахаре"
 SAF_sugar_act_desc: "Промышленность Наталя, организованная и защищённая. Побережье просит об этом двадцать лет."
 SAF_mining_registration_act: "Закон о горной регистрации"
 SAF_mining_registration_act_desc: "Заявки, титулы и рабочая сила в одном реестре. Скучно — и дороже всего остального вместе взятого."
 SAF_land_bank_act: "Закон о Земельном банке"
 SAF_land_bank_act_desc: "Дешёвый кредит под землю, выдаваемый государством. Последний кусок бума — и тот, что его переживёт."

 ### RESOLVING THE COALITION ################################################

 SAF_continue_the_course: "Держаться курса"
 SAF_continue_the_course_desc: "Слиянию восемь лет, и оно переживало худшее. Пусть кабинет идёт как идёт, а Палата решит вопрос, когда вопрос действительно встанет."

 SAF_hertzog_government:0 "Правительство Герцога"
 SAF_hertzog_government_desc:0 "Союз сохраняет премьер-министра и его убеждения. Что бы ни пришло теперь — оно придёт на его условиях."
 SAF_smuts_government:0 "Правительство Смутса"
 SAF_smuts_government_desc:0 "Правительство теперь принадлежит генералу — и уже смотрит на север."

 SAF_force_the_issue: "Форсировать вопрос"
 SAF_force_the_issue_desc: "Поставьте вопрос перед кабинетом сейчас, в открытую, и покончите с этим. Кто командует правительством сегодня, тот будет командовать им и завтра."
 SAF_the_walk_out:0 "Уход из коалиции"
 SAF_the_walk_out_desc:0 "Оказавшись в меньшинстве в собственном правительстве, слабейшее крыло в знак протеста покидает коалицию."
 SAF_force_the_issue_tt: "§YРазрешает коалиционный вопрос немедленно§!, при текущем балансе. §RЗакрывает все ещё открытые министерские направления.§!"
 SAF_coalition_open_tt:0 "§YКабинет слияния§! ещё открыт"
 SAF_hertzog_wing_alone_tt:0 "После ухода §Yкрыло Герцога§! правит в одиночку"
 SAF_smuts_wing_alone_tt:0 "После ухода §Yкрыло Смутса§! правит в одиночку"
 SAF_hertzog_wing_not_frozen_tt:0 "§YКрыло Герцога§! не отстранено от власти"
 SAF_smuts_wing_not_frozen_tt:0 "§YКрыло Смутса§! не отстранено от власти"
 SAF_weekly_support_non_1_tt:0 "Еженедельная поддержка Нейтралитета: §Y+0.15%§!"
 SAF_weekly_support_non_2_tt:0 "Еженедельная поддержка Нейтралитета: §Y+0.30%§!"
 SAF_weekly_support_non_3_tt:0 "Еженедельная поддержка Нейтралитета: §Y+0.45%§!"
 SAF_weekly_support_non_4_tt:0 "Еженедельная поддержка Нейтралитета: §Y+0.60%§!"
 SAF_weekly_support_non_5_tt:0 "Еженедельная поддержка Нейтралитета: §Y+0.75%§!"
 SAF_weekly_support_dem_1_tt:0 "Еженедельная поддержка Демократии: §Y+0.15%§!"
 SAF_weekly_support_dem_2_tt:0 "Еженедельная поддержка Демократии: §Y+0.30%§!"
 SAF_weekly_support_dem_3_tt:0 "Еженедельная поддержка Демократии: §Y+0.45%§!"
 SAF_weekly_support_dem_4_tt:0 "Еженедельная поддержка Демократии: §Y+0.60%§!"
 SAF_weekly_support_dem_5_tt:0 "Еженедельная поддержка Демократии: §Y+0.75%§!"
 SAF_impact_step_non_tt:0 "Еженедельная поддержка Нейтралитета: §Y+0.15%§!"
 SAF_impact_step_dem_tt:0 "Еженедельная поддержка Демократии: §Y+0.15%§!"

 ### GOVERNMENT HOUSE #######################################################

 SAF_de_wet_governor_general: "Генерал-губернатор де Вет"
 SAF_duncan_governor_general: "Генерал-губернатор Дункан"
 SAF_de_wet_governor_general_effect_tt:0 "§YДункан остаётся в министерстве шахт и промышленности.§!"
 SAF_duncan_governor_general_effect_tt:0 "§RДункан покидает кабинет.§!"
 SAF_duncan_hands_over_tt: "§RДункан покидает кабинет навсегда.§! §YСтаттафорд§! принимает шахты и промышленность на достигнутой ступени — по более слабой лестнице."
 SAF_duncan_refuses_tt:0 "§YДункан отказывает в роспуске парламента.§!"
 SAF_duncan_no_recourse_tt:0 "§YПока Дункан в резиденции генерал-губернатора, просить о роспуске не у кого.§!"

 ### OUTCOMES ###############################################################

 SAF_cabinet_hertzog_dominant: "Кабинет: господство Герцога"
 SAF_cabinet_hertzog_leaning: "Кабинет: перевес Герцога"
 SAF_cabinet_deadlock: "Кабинет: тупик"
 SAF_cabinet_smuts_leaning: "Кабинет: перевес Смутса"
 SAF_cabinet_smuts_dominant: "Кабинет: господство Смутса"
 SAF_walk_out_crisis:0 "Кабинет: угроза ухода из коалиции"

 SAF_hertzog_in_opposition: "Герцог в оппозиции"

 SAF_hertzog_prevails_warning_tt:0 "§RГерцог остаётся премьер-министром и в войну.§! Правительство слабеет за каждую африканскую область, потерянную союзниками, — дороже всего обходятся ключевые позиции."


 ############################################################################
 ### EVENTS
 ############################################################################

 SAF.1.t: "Резиденция генерал-губернатора"
 SAF.1.d: "Срок лорда Кларендона истёк, и впервые Союз сам назовёт своего генерал-губернатора, а не примет назначенного Лондоном. Он вступит в должность через неделю.\n\nЭто похоже на почётное назначение. Но это не так. Если этот парламент когда-нибудь расколется из-за войны, человек в резиденции генерал-губернатора решит, получит ли премьер-министр роспуск — а значит, уцелеет ли премьер-министр.\n\n§YНиколас Якобус де Вет§! — юрист тех же убеждений, что и премьер-министр; он удержал бы корону подальше от дел кабинета. §YСэр Патрик Дункан§! — нет. Но он занимает шахты и промышленность, а резиденция генерал-губернатора — не место для действующего министра."
 SAF.1.a: "Нас представит Николас Якобус де Вет."
 SAF.1.b: "Сэр Патрик Дункан. Министра шахт мы найдём другого."

 SAF.10.t: "Развязка коалиции"
 SAF.10.d: "Слиянию больше некуда отступать."
 SAF.10.a: "Быть по сему."

 SAF.22.t:0 "Голосование о нейтралитете"
 SAF.22.d_resignation:0 "Предложение о нейтралитете вынесено на голосование, и Палата его уничтожает. Разрыв не оставляет надежды на пересмотр, а пока сэр Патрик Дункан в резиденции генерал-губернатора, просить о роспуске не у кого — и каждый депутат на обеих скамьях это знает.\n\nГерцог не просит. В тот же день он слагает с себя премьерство, а с ним и мандат, и покидает зал, не сказав ни слова."
 SAF.22.d_refusal:0 "Страна за премьер-министра. Палата — с перевесом в горстку голосов — нет: предложение о нейтралитете проваливается, к удивлению всех, и Герцога прежде всего.\n\nОн едет в резиденцию генерал-губернатора просить о роспуске, который наверняка вернул бы его. Сэр Патрик Дункан отказывает. Премьер-министр сам посадил его туда — и премьер-министр ничего не может с этим поделать.\n\nСмутс принимает правительство, которого страна ему не давала."
 SAF.22.a:0 "Палата сказала своё слово."
 SAF.22.b:0 "Парламент стоит."


 SAF.12.t: "Премьер-министр берёт верх"
 SAF.12.d: "Палата голосует, и на этот раз люди премьер-министра готовы. Предложение о нейтралитете проигрывает с малым перевесом — Союз вступает в войну, — но Герцог не падает, и никто не требует его ухода.\n\nОн остаётся премьер-министром. Смутс предпочёл выйти из правительства, чем сидеть в нём.\n\nСоюз воюет под началом человека, который четыре года доказывал, что воевать не следует. Это продержится, пока с севера приходят хорошие вести."
 SAF.12.a: "Союз будет воевать на наших условиях — или не будет вовсе."

 SAF.13.t: "Взятая власть"
 SAF.13.d: "У фракции есть большинство, и ждать войны, чтобы им воспользоваться, она не намерена. Герцога не спрашивают — его ставят в известность; отставка устроена, преемственность устроена, и всё кончается за одно утро.\n\nГенерал Смутс — премьер-министр. Союз начинает вооружаться всерьёз, на месяцы раньше, чем кто-либо ожидал.\n\nПлаттеланд не забудет, как это было сделано."
 SAF.13.a: "Страна потом скажет нам спасибо."

 SAF.16.t: "Форсировать вопрос"
 SAF.16.d: "Вопрос ставится перед кабинетом сейчас, не дожидаясь Европы. Правительство можно отдать любому крылу, каким бы ни был баланс в стране, — и чем дальше страна от крыла, которое его берёт, тем дороже её разворачивать."
 SAF.16.a: "Правительство ведёт §YДж. Б. М. Герцог§!."
 SAF.16.b: "Правительство берёт §YЯн Смутс§!."

 SAF.21.t:0 "Угроза ухода из коалиции"
 SAF.21.d:0 "Слабейшее крыло не станет сидеть под господством другого. Если за шестьдесят дней баланс не восстановится, его министры уходят из коалиции."
 SAF.21.a:0 "Шестьдесят дней."

 SAF.23.t:0 "Коалиция распадается"
 SAF.23.d_hertzog:0 "Министры-интервенционисты подают в отставку разом, и Смутс уводит своих людей из правительства.\n\nГерцог правит один. За столом больше нет никого, кто спорил бы с его министрами."
 SAF.23.d_smuts:0 "Министры-националисты уходят из кабинета, лишь бы не сидеть под господством, которое им не сломить, и Герцог уходит с ними — из общественной жизни совсем.\n\nСмутс собирает правительство из того, что осталось. За столом больше нет никого, кто спорил бы с его министрами."
 SAF.23.a:0 "Значит, в одиночку."




