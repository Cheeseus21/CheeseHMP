 SAF_reserve_bank_loan:0 "Reserve Bank Loan"
 SAF_reserve_bank_loan_desc:0 "The Reserve Bank advances the government a war chest against future revenue. The bill lands on the household."
 SAF_british_loan:0 "British Loan"
 SAF_british_loan_desc:0 "London is asked for short-term credit toward the infrastructure of the new territories. The terms are London's to set."
 SAF_american_loan:0 "American Loan"
 SAF_american_loan_desc:0 "Washington is asked for short-term credit toward the infrastructure of the new territories. The terms are Washington's to set."
 SAF_natal_chromium_rights:0 "Natal Chromium Rights"
 SAF_natal_chromium_rights_desc:0 "Natal's chromium seams are signed over to British buyers. Their capital builds the province."
 SAF_reserve_bank_repayment:0 "Reserve Bank Repayment"
 SAF_reserve_bank_repayment_desc:0 "The domestic loan is repaid out of the household budget."
 SAF_british_loan_small:0 "British Loan"
 SAF_british_loan_small_desc:0 "5 off-map civilian factories, on loan from London for a year."
 SAF_british_loan_large:0 "British Loan"
 SAF_british_loan_large_desc:0 "10 off-map civilian factories, on loan from London for a year."
 SAF_american_loan_small:0 "American Loan"
 SAF_american_loan_small_desc:0 "5 off-map civilian factories, on loan from Washington for a year."
 SAF_american_loan_large:0 "American Loan"
 SAF_american_loan_large_desc:0 "10 off-map civilian factories, on loan from Washington for a year."
 SAF_south_african_loans:0 "South African Loans"
 SAF_south_african_loans_desc:0 "Credit extended to Pretoria: these factories work for South Africa until the loan is repaid."
 SAF.30.t:0 "South Africa Seeks a Loan"
 SAF.30.d:0 "The Union government is seeking short-term loans to finance infrastructure works across southern Africa. Pretoria's request has reached London: the size of the loan - and its terms - are ours to decide."
 SAF.30.a:0 "A small loan"
 SAF.30.b:0 "A large loan"
