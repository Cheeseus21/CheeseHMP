 # African crisis map GUI
 SAF_african_crisis_decisions:0 "Африканский кризис"
 SAF_african_crisis_decisions_desc:0 "Каждая область Африки, потерянная в пользу Оси, добавляет к кризису свою базовую цену стабильности, умноженную на месячный темп потерь. Цена сохраняется и после стабилизации фронта; за отбитые области возвращается только базовая цена. Ключевые позиции (звёзды на карте) дополнительно стоят по §R3%§! стабильности, пока их удерживает Ось. Ближний Восток при полной потере единоразово стоит §R5%§!; отвоевание ничего не возмещает. Ливия не имеет цены потери: её завоевание возвращает по §Y0,5%§! за область, а потеря этих завоеваний снова их отнимает."
 SAF_hac_show_tier_1:0 "Показать области со штрафом 0,5%"
 SAF_hac_show_tier_1_desc:0 "Египет: §Y0,5%§! за каждую потерянную область."
 SAF_hac_show_tier_2:0 "Показать области со штрафом 1%"
 SAF_hac_show_tier_2_desc:0 "Южный Египет: §Y1%§! за каждую потерянную область."
 SAF_hac_show_tier_3:0 "Показать области со штрафом 1,25%"
 SAF_hac_show_tier_3_desc:0 "Судан: §Y1,25%§! за каждую потерянную область."
 SAF_hac_show_tier_4:0 "Показать области со штрафом 1,5%"
 SAF_hac_show_tier_4_desc:0 "Сомалиленд: §Y1,5%§! за каждую потерянную область. Итальянская Восточная Африка: §Y1,5%§! за каждую потерянную область, учитывается только после первого падения Асуана."
 SAF_hac_show_tier_5:0 "Показать области со штрафом 2%"
 SAF_hac_show_tier_5_desc:0 "Восточная Африка: §Y2%§! за каждую потерянную область. Французская Африка: §Y2%§! за каждую потерянную область."
 SAF_hac_show_tier_6:0 "Показать области со штрафом 2,5%"
 SAF_hac_show_tier_6_desc:0 "Конго: §Y2,5%§! за каждую потерянную область."
 SAF_hac_show_tier_7:0 "Показать области со штрафом 3%"
 SAF_hac_show_tier_7_desc:0 "Юг Африки: §Y3%§! за каждую потерянную область."
 SAF_hac_show_tier_8:0 "Показать области со штрафом 5%"
 SAF_hac_show_tier_8_desc:0 "Родезия: §Y5%§! за каждую потерянную область."
 SAF_hac_show_tt:0 "Подсвечивает эти области на карте при наведении. Принятие решения не даёт никакого эффекта."
 SAF_hac_map_tt:0 "Базовая цена стабильности за каждую потерянную область, умножается на месячный темп потерь:\nЗелёный: Ливия, без цены потери; завоевание возвращает по §Y0,5%§! за область\nСалатовый: §Y0,5%§! (Египет)\nЖёлтый: §Y1%§! (Южный Египет)\nЯнтарный: §Y1,25%§! (Судан)\nОранжевый: §Y1,5%§! (Сомалиленд, Итальянская Восточная Африка)\nТёмно-оранжевый: §Y2%§! (Восточная Африка, Французская Африка)\nАлый: §Y2,5%§! (Конго)\nКрасный: §Y3%§! (юг Африки)\nТёмно-красный: §Y5%§! (Родезия)\nБирюзовый: Ближний Восток, единоразовый блок в §R5%§! при полной потере, без возмещения\nЗвёзды: ключевые позиции, по §R3%§! стабильности, пока их удерживает Ось\nЧёрная штриховка: сейчас под контролем Оси"
