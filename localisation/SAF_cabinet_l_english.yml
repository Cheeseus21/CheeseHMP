 ############################################################################
 ### EVENTS
 ############################################################################

 SAF.1.t:0 "Government House"
 SAF.1.d:0 "Lord Clarendon's term is up, and for the first time the Union will name its own Governor-General rather than accept London's. He takes office in a week.\n\nIt looks like a courtesy appointment. It is not. If this Parliament ever divides on a war, the man at Government House decides whether the Prime Minister gets his dissolution — and therefore whether the Prime Minister survives.\n\n§RNicolaas Jacobus de Wet§! is a jurist of the Prime Minister's persuasion, and would keep the Crown out of the Cabinet's business. §RSir Patrick Duncan§! would not — but he sits at Mines and Industries, and Government House is no place for a serving minister."
 SAF.1.a:0 "Nicolaas Jacobus de Wet represents us."
 SAF.1.b:0 "Sir Patrick Duncan. We will find another Minister of Mines."

 SAF.10.t:0 "The Coalition Resolves"
 SAF.10.d:0 "The Fusion has run out of room."
 SAF.10.a:0 "So be it."

 SAF.22.t:0 "The Vote of Neutrality"
 SAF.22.d_resignation:0 "The motion for neutrality is put to the House, and the House destroys it. The margin is beyond appeal, and with Sir Patrick Duncan at Government House there is no dissolution to ask for — every member on both benches knows it.\n\nHertzog does not ask. He resigns the premiership the same afternoon, and his seat with it, and leaves the chamber without a word."
 SAF.22.d_refusal:0 "The country is with the Prime Minister. The House, by a handful of votes, is not — the motion for neutrality fails to the surprise of everyone, Hertzog most of all.\n\nHe drives to Government House to ask for the dissolution that would surely return him. Sir Patrick Duncan refuses. The Prime Minister put him there, and the Prime Minister can do nothing about it.\n\nSmuts takes a government the country has not given him."
 SAF.22.a:0 "The House has spoken."
 SAF.22.b:0 "Parliament stands."


 SAF.12.t:0 "The Prime Minister Prevails"
 SAF.12.d:0 "The House divides, and this time the Prime Minister's people are ready for it. The motion for neutrality is lost narrowly — the Union goes to war — but Hertzog does not, and he is not asked to.\n\nHe remains Prime Minister. Smuts has left the government rather than sit in it.\n\nThe Union is at war under a man who spent four years arguing it should not be. That will hold as long as the news from the north is good."
 SAF.12.a:0 "The Union will fight on our terms, or not at all."

 SAF.13.t:0 "A Government Taken"
 SAF.13.d:0 "The caucus has the numbers and does not intend to wait for a war to use them. Hertzog is informed rather than consulted; the resignation is arranged, the succession is arranged, and it is all over in a morning.\n\nGeneral Smuts is Prime Minister. The Union begins to arm in earnest, months before anyone expected it to.\n\nThe platteland will not forget how this was done."
 SAF.13.a:0 "The country will thank us later."

 SAF.16.t:0 "Force the Issue"
 SAF.16.d:0 "The question goes to the Cabinet now rather than waiting on Europe. Either wing can be given the government, whatever the balance in the country - and the further the country is from the wing that takes it, the more it costs to bring round."
 SAF.16.a:0 "§YJ.B.M. Hertzog§! carries the government."
 SAF.16.b:0 "§YJan Smuts§! takes the government."

 SAF.21.t:0 "A Walk-Out Threatened"
 SAF.21.d:0 "The lesser wing will not sit under the other's dominance. Unless the balance is restored within sixty days, its ministers walk out of the coalition."
 SAF.21.a:0 "Sixty days."

 SAF.23.t:0 "The Coalition Breaks"
 SAF.23.d_hertzog:0 "The interventionist ministers hand in their resignations together, and Smuts leads his people out of the government.\n\nHertzog governs alone. There is nobody left at the table to argue his ministers down."
 SAF.23.d_smuts:0 "The nationalist ministers walk out of the Cabinet rather than sit under a dominance they cannot break, and Hertzog goes with them, out of public life altogether.\n\nSmuts forms his government from what remains. There is nobody left at the table to argue his ministers down."
 SAF.23.a:0 "Alone, then."




