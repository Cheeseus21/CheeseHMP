 ############################################################################
 ### SOUTH AFRICA - THE FUSION CABINET
 ############################################################################

 ### MINISTERS ##############################################################

 SAF_nicolaas_havenga:0 "Minister of Finance"
 SAF_sir_patrick_duncan:0 "Minister of Mines and Industries"

 ### THE CRISIS #############################################################

 SAF_the_abyssinian_crisis:0 "The Abyssinian Crisis"
 SAF_the_abyssinian_crisis_desc:0 "Italy is in Addis Ababa and the League has done nothing. The Prime Minister wants the matter closed; the Deputy Prime Minister wants collective security honoured. Neither man can govern without the other, and neither intends to give way.\n\nThe Cabinet is now the battlefield."

 ### CABINET GATES ##########################################################

 SAF_minister_havenga_seated_tt:0 "§YN.C. Havenga§! sits in Cabinet as a political advisor."
 SAF_minister_pirow_seated_tt:0 "§YOswald Pirow§! sits in Cabinet as a political advisor."
 SAF_minister_hofmeyr_seated_tt:0 "§YJan Hendrik Hofmeyr§! sits in Cabinet as a political advisor."

 SAF_cabinet_favours_hertzog_tt:0 "§YNon-Aligned§! support is ahead of §YDemocratic§!."
 SAF_cabinet_favours_smuts_tt:0 "§YDemocratic§! support is ahead of §YNon-Aligned§!."

 SAF_flip_to_smuts_tt:0 "§RStability§! falls by absorbed support divided by the new total."
 SAF_flip_to_hertzog_tt:0 "§RWar support§! falls by absorbed support divided by the new total."


 SAF_hertzog_man_havenga:0 "Hertzog's Man"
 SAF_hertzog_man_pirow:0 "Hertzog's Man"
 SAF_smuts_man_hofmeyr:0 "Smuts's Man"
 SAF_smuts_man_duncan:0 "Smuts's Man"
 SAF_smuts_man_stuttaford:0 "Smuts's Man"

 SAF_free_cabinet_seat_tt:0 "There is §Ya seat free at the Cabinet table§!."

 ### THE CABINET DECISIONS ##################################################

 SAF_cabinet_decisions:0 "The Fusion Cabinet"

 SAF_cabinet_reshuffle:0 "Cabinet Reshuffle"
 SAF_cabinet_reshuffle_desc:0 "A ministry can be rearranged without anyone resigning in public, provided it is done all at once and called housekeeping. For as long as it lasts, portfolios are open and nobody's dismissal is news."
 SAF_reshuffle_once_a_year_tt:0 "The Cabinet has §Ynot§! already been reshuffled this year."
 SAF_reshuffle_open_tt:0 "§YThe Cabinet is open for 28 days.§! Appointments and dismissals cost §Gnothing§!."
 SAF_reshuffle_closed_tt:0 "§RThe reshuffle is over.§! Dismissals cost political power and support again."
 SAF_reshuffle_not_active_tt:0 "A §YCabinet Reshuffle§! is not in progress."
 SAF_cabinet_walk_out:0 "A Walk-Out Looms"
 SAF_cabinet_walk_out_desc:0 "One wing has come to dominate the Cabinet. Restore the balance within sixty days, or the other walks out of the coalition."

 SAF_dismiss_havenga:0 "Dismiss N.C. Havenga"
 SAF_dismiss_havenga_desc:0 "The Minister of Finance is to be told his services are no longer required. He has been in this Cabinet since it was formed and will not go quietly."
 SAF_dismiss_pirow:0 "Dismiss Oswald Pirow"
 SAF_dismiss_pirow_desc:0 "The Minister of Defence is to be dropped. He will take the rearmament programme's supporters with him and say exactly what he thinks on the way out."
 SAF_dismiss_hofmeyr:0 "Dismiss Jan Hendrik Hofmeyr"
 SAF_dismiss_hofmeyr_desc:0 "The Minister of the Interior is to be dropped. He has resigned on principle before and will make this one look like the same thing."
 SAF_dismiss_duncan:0 "Dismiss Sir Patrick Duncan"
 SAF_dismiss_duncan_desc:0 "The Minister of Mines and Industries is to be dropped. He is the most respected man in the ministry and everybody in Parliament knows it."
 SAF_dismiss_stuttaford:0 "Dismiss Richard Stuttaford"
 SAF_dismiss_stuttaford_desc:0 "The Minister of Mines and Industries is to be dropped. He took the portfolio as a favour, and returning it will not cost him much sleep."



 SAF_smuts_soldier_statesman:0 "Soldier-Statesman"
 SAF_smuts_soldier_statesman_2:0 "Soldier-Statesman"

 SAF_smuts_deputy_prime_minister:0 "Smuts in Cabinet"

 ### HAVENGA - FINANCE ######################################################

 SAF_the_havenga_pillar:0 "The Havenga Treasury"
 SAF_the_havenga_pillar_desc:0 "Klasie Havenga took us off gold in 1932 and has balanced every budget since. He is Hertzog's oldest ally and the hardest man in the Cabinet to argue with on a matter of money."
 SAF_insolvency_act:0 "Insolvency Act"
 SAF_insolvency_act_desc:0 "The Depression left a decade of bad paper behind it. Clearing the courts of it will let credit move again."
 SAF_farmers_assistance_act:0 "Farmers' Assistance Act"
 SAF_farmers_assistance_act_desc:0 "Relief for the platteland, where the National Party's vote lives. The men who take it will remember who signed the cheque."
 SAF_workmen_compensation_act:0 "Workmen's Compensation Act"
 SAF_workmen_compensation_act_desc:0 "Compensation for injury on the mines and in the works, set at a rate industry can carry."
 SAF_pensions_act:0 "Pensions Act"
 SAF_pensions_act_desc:0 "A pension for the poor white, funded out of the gold revenue. The most popular thing the Treasury has ever done."

 ### PIROW - DEFENCE ########################################################

 SAF_the_pirow_program:0 "The Pirow Programme"
 SAF_the_pirow_program_desc:0 "Oswald Pirow's five-year defence plan: roads, steel, a Special Service Battalion, and an air force. He is also the most openly pro-German man in the Cabinet, and he does not trouble to hide it."
 SAF_national_roads_act:0 "National Roads Act"
 SAF_national_roads_act_desc:0 "A national road board with its own fund. Pirow argues it is a defence measure. He is not entirely wrong."
 SAF_iron_and_steel_industry_act:0 "Iron and Steel Industry Act"
 SAF_iron_and_steel_industry_act_desc:0 "ISCOR at Pretoria is to be expanded. A country that cannot roll its own plate cannot arm itself."
 SAF_defence_amendment_act:0 "Defence Amendment Act"
 SAF_defence_amendment_act_desc:0 "A Coast Garrison Force, an enlarged Active Citizen Force, and the legal machinery to call them out."
 SAF_appropriation_act:0 "Appropriation Act"
 SAF_appropriation_act_desc:0 "The defence vote, passed at last. Pirow has asked for more every year and been given less; this time he gets most of it."

 ### HERTZOG - PRIME MINISTER AND EXTERNAL AFFAIRS ##########################

 SAF_the_hertzog_bills:0 "The Hertzog Bills"
 SAF_the_hertzog_bills_desc:0 "The Prime Minister holds External Affairs himself. What he wants from this Parliament is a settled native policy and a sovereignty that London cannot reach."
 SAF_native_trust_and_land_act:0 "Native Trust and Land Act"
 SAF_native_trust_and_land_act_desc:0 "The companion measure. It settles the land question on the Government's terms and buys Hertzog the two-thirds majority he has wanted for fifteen years."
 SAF_coronation_oath_act:0 "Coronation Oath Act"
 SAF_coronation_oath_act_desc:0 "The King will swear a separate oath for the Union. A small thing, and the whole argument in miniature: we are not a colony, and our quarrels are our own."
 SAF_south_africa_amendment_act:0 "South Africa Act Amendment"
 SAF_south_africa_amendment_act_desc:0 "The furthest Hertzog has ever pushed it. The Union's sovereignty is absolute, and that includes the right to stand aside from a British war."

 ### SMUTS - JUSTICE ########################################################

 SAF_the_smuts_statutes:0 "The Smuts Statutes"
 SAF_the_smuts_statutes_desc:0 "The Deputy Prime Minister holds Justice. He cannot be dismissed, he will not resign, and he intends to leave the Union governable by whoever comes after Hertzog."
 SAF_general_law_act:0 "General Law Amendment Act"
 SAF_general_law_act_desc:0 "A tidying measure, and a quiet extension of what the state may do in an emergency it has not yet declared."
 SAF_public_service_act:0 "Public Service Act"
 SAF_public_service_act_desc:0 "A professional civil service, appointed on merit and not on party. Hertzog's people understand exactly what this is for."
 SAF_industrial_conciliation_act:0 "Industrial Conciliation Act"
 SAF_industrial_conciliation_act_desc:0 "Machinery to settle disputes on the Rand before they close the mines. Industrial peace is worth more than any division in the House."
 SAF_senate_act:0 "Senate Act"
 SAF_senate_act_desc:0 "The composition of the Upper House, arranged so that it will not obstruct the government that has to fight the next war."

 ### HOFMEYR - THE INTERIOR #################################################

 SAF_the_hofmeyr_interventions:0 "The Hofmeyr Interventions"
 SAF_the_hofmeyr_interventions_desc:0 "Jan Hofmeyr took a degree at fifteen and a Cabinet post at thirty-five, and he has never once voted for a thing he did not believe. He is Smuts's man, and the conscience of the government."
 SAF_broadcasting_act:0 "Broadcasting Act"
 SAF_broadcasting_act_desc:0 "A South African Broadcasting Corporation, in both languages, answerable to Parliament. Whoever holds it will be heard in every kitchen in the Union."
 SAF_unemployment_benefits_act:0 "Unemployment Benefit Act"
 SAF_unemployment_benefits_act_desc:0 "Contributory insurance against being thrown out of work. Modest, and more than anyone has offered before."
 SAF_childrens_act:0 "Children's Act"
 SAF_childrens_act_desc:0 "Schools, and a duty on the state to keep children in them. Hofmeyr's own answer to the poor white question, and a longer one than the Treasury's."
 SAF_public_health_act:0 "Public Health Act"
 SAF_public_health_act_desc:0 "Hofmeyr will not administer a health service that stops at the colour bar, and he has the votes to say so. The recruiting sergeants will feel the difference before the doctors do."

 ### DUNCAN - MINES AND INDUSTRIES ##########################################

 SAF_the_duncan_boom:0 "[GetSAFMinesMinistryName]"
 SAF_the_duncan_boom_desc:0 "[GetSAFMinesMinistryDesc]"
 SAF_the_duncan_boom_duncan:0 "The Duncan Boom"
 SAF_the_duncan_boom_duncan_desc:0 "Gold at 140 shillings and a Minister of Mines who knows what to do with it. Patrick Duncan is a Smuts man, an Englishman by birth, and the most quietly effective administrator in the Cabinet."
 SAF_the_duncan_boom_stuttaford:0 "The Stuttaford Apprenticeship"
 SAF_the_duncan_boom_stuttaford_desc:0 "Duncan is at Government House and the mines have been handed to a draper. Richard Stuttaford has sold furniture to half of Cape Town and never in his life costed a shaft.\n\nHe will learn the portfolio. He will learn it slowly, and the industry will pay his tuition."
 SAF_gold_tax_act:0 "Gold Tax Act"
 SAF_gold_tax_act_desc:0 "An excess profits duty on the mines. The Chamber will complain; the Treasury will not."
 SAF_sugar_act:0 "Sugar Act"
 SAF_sugar_act_desc:0 "The Natal industry, organised and protected. The coast has been asking for twenty years."
 SAF_mining_registration_act:0 "Mining Registration Act"
 SAF_mining_registration_act_desc:0 "Claims, titles and labour on one register. Dull, and worth more than all the rest of it."
 SAF_land_bank_act:0 "Land Bank Act"
 SAF_land_bank_act_desc:0 "Cheap credit against land, lent by the state. The last piece of the boom, and the one that outlasts it."

 ### RESOLVING THE COALITION ################################################

 SAF_continue_the_course:0 "Continue the Course"
 SAF_continue_the_course_desc:0 "The Fusion is eight years old and has survived worse than this. Let the Cabinet go on as it is, and let the House settle the question when the question actually arrives."

 SAF_hertzog_government:0 "The Hertzog Government"
 SAF_hertzog_government_desc:0 "The Union keeps its Prime Minister and his convictions. Whatever comes now comes on his terms."
 SAF_smuts_government:0 "The Smuts Government"
 SAF_smuts_government_desc:0 "The government is the General's now, and it is already looking north."

 SAF_force_the_issue:0 "Force the Issue"
 SAF_force_the_issue_desc:0 "Put it to the Cabinet now, on the floor, and have done with it. Whoever commands the government today will command it tomorrow."
 SAF_the_walk_out:0 "The Walk-Out"
 SAF_the_walk_out_desc:0 "Outweighed in its own government, the lesser wing leaves the coalition in protest."
 SAF_force_the_issue_tt:0 "§YResolves the coalition now§!, at the current balance. §RCloses every ministerial pillar still open.§!"
 SAF_coalition_open_tt:0 "The §YFusion Cabinet§! is still open"
 SAF_hertzog_wing_alone_tt:0 "§YHertzog's wing§! governs alone after the walk-out"
 SAF_smuts_wing_alone_tt:0 "§YSmuts's wing§! governs alone after the walk-out"
 SAF_hertzog_wing_not_frozen_tt:0 "§YHertzog's wing§! has not been turned out of office"
 SAF_smuts_wing_not_frozen_tt:0 "§YSmuts's wing§! has not been turned out of office"
