 SAF_cabinet_mechanic_guide:0 "Cabinet Mechanic Guide"
 SAF_cabinet_mechanic_guide_desc:0 "Opens a written explanation of the Fusion Cabinet: how the balance is read, what each state costs, and how the coalition ends."
 SAF.40.t:0 "Cabinet Mechanic Guide"
 SAF.40.d:0 "The Fusion Cabinet is a balance between J.B.M. Hertzog's non-aligned bloc and Jan Smuts' democratic bloc, and it is read entirely from party popularity.\n\n§RWHERE TO READ IT§!\nThe §RFusion Cabinet§! modifier tooltip shows what each wing's seated ministers add to their own party every week and which way the net is moving; the modifier's own lines are the penalty you are paying right now. The gap is §Rnon-aligned popularity minus democratic popularity§! - positive favours Hertzog, negative favours Smuts.\n\n§RTHE FIVE STATES§!\nThe gap is checked weekly and sets one of five states:\n§RHertzog Ascendant§! (above 20): Stability +10%, War Support -10%, Recruitable Population -10%\n§RHertzog Leading§! (above 10): Stability +5%, Political Power -10%, War Support -5%\n§RDeadlock§! (within 10 either way): Political Power -15%\n§RSmuts Leading§! (below -10): War Support +5%, Political Power -10%, Stability -5%\n§RSmuts Ascendant§! (below -20): War Support +10%, Stability -10%, Daily Fascism Support +0.01\n\n§RMINISTERS AND RADICALS§!\nA seated minister moves his party's popularity every week, and every Act he carries moves it faster. Each Act carried by an advisor also raises that wing's §RRadicalised Cabinet§! ladder by one step; an Act carried by the wing's own leader lowers it by two. The Hertzog ladder costs Stability, War Support, Political Power and Factory Output at 2.5% per step; the Smuts ladder costs Consumer Goods and Mobilisation Speed. §RRein In the Radicals§! buys one step back for 100 Political Power.\n\n§RTHE WALK-OUT§!\nWhile either wing is Ascendant the balance is tracked daily. Past 30 either way the outweighed wing starts a 60-day countdown, and while it runs the Union carries §RWalk-Out Crisis§!: Political Power -25%, Stability -25%. Bringing the gap back inside 30 cancels it.\n\n§RHOW IT ENDS§!\nThree outcomes, mutually exclusive.\n§RForce the Issue§! is the only one you take by hand, and only after the Anschluss. You choose which wing takes the government.\n§RContinue the Course§! completes on its own when Germany declares war on the Allies. Smuts takes over and Hertzog goes into opposition, or retires outright.\n§RThe Walk-Out§! completes if the countdown runs out. The dominant wing turns the other out and governs alone, with its own radicals pinned at the ceiling.\n\nWhichever fires, the cabinet closes and the balance modifier is removed. Seated ministers' programmes are banked as permanent national spirits, except in a walk-out, where the losing wing's work leaves with it."
 SAF.40.a:0 "Understood."
