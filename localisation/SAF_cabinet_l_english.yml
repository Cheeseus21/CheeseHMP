 ### GOVERNMENT HOUSE #######################################################

 SAF_de_wet_governor_general:0 "Governor-General de Wet"
 SAF_duncan_governor_general:0 "Governor-General Duncan"
 SAF_de_wet_governor_general_effect_tt:0 "§YDuncan remains at Mines and Industries.§!"
 SAF_duncan_governor_general_effect_tt:0 "§RDuncan leaves the Cabinet.§!"
 SAF_duncan_hands_over_tt:0 "§RDuncan leaves the Cabinet permanently.§! §YStuttaford§! takes Mines and Industries at the tier reached, on a weaker ladder."
 SAF_duncan_refuses_tt:0 "§YDuncan refuses the dissolution.§!"
 SAF_duncan_no_recourse_tt:0 "§YWith Duncan at Government House, there is no dissolution to ask for.§!"

